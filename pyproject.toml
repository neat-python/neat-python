[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neat-python-classic"
version = "0.2.0"
description = "A NEAT (NeuroEvolution of Augmenting Topologies) implementation — 2007 academic codebase, modernized for Python 3"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Cesar Gomes Miguel" },
    { name = "Carolina Feher da Silva" },
    { name = "Marcio Lobo Netto" },
]
keywords = ["neat", "neuroevolution", "genetic-algorithm", "neural-network"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
viz = ["matplotlib>=3.7", "pydot>=2.0"]

[project.urls]
Homepage = "https://github.com/neat-python/neat-python"
Repository = "https://github.com/neat-python/neat-python"

[tool.setuptools.packages.find]
include = ["neat*"]
